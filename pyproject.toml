[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hazdet"
version = "0.1.1"
# version is already specified above, so removing dynamic
# dynamic = ["version"]
dependencies =[
    "python-dateutil >= 2.8.2",
    "pytz >= 2020.1",
    "scikit-learn >= 1.9.0",
    "scipy>=1.10",
    "scikit-optimize >= 0.10.2",
    "joblib >= 1.0",
    "sentence-transformers >= 2.7.0",
    "transformers >= 4.51.0",
    "tqdm",
    "torch >= 2.6.0",
    "nltk",
    "sentencepiece",
    "huggingface-hub >= 0.24.0",
    "Pillow",
    "demoji==1.1.0",
    "pandas >= 2.2.0",
    "numpy >= 1.17",
    "xgboost-cpu >= 2.0.0",
    "matplotlib >= 3.10.3"]
requires-python = ">= 3.12"
authors = [
  {name = "Keith Burghardt"},
  {name = "Xavier Wilson"}
  ]
maintainers = [
  {name = "Keith Burghardt"},
  {name = "Xavier Wilson"}
]
description = "Classify social media comments as AI / Not AI / Other"
readme = "README.md"
license = "MIT"
license-files = ["AUTHORS.md"]
keywords = ["reddit", "nlp", "detection", "social media", "classifier"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12"]


[project.urls]
Documentation = "https://github.com/KeithBurghardt/HazardPackage/blob/main/README.md"
Repository = "https://github.com/KeithBurghardt/HazardPackage"
Issues = "https://github.com/KeithBurghardt/HazardPackage/issues"
Changelog = "https://github.com/KeithBurghardt/HazardPackage/blob/master/CHANGELOG.md"
